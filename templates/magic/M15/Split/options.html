<form-group class="with-border" group-id="frame-options">
    <label>Frame Options</label>
    <form-field field-id="frame"></form-field>
    <form-field field-id="artSize"></form-field>
</form-group>

<form-group class="with-border" group-id="top-text-options">
    <label>Top Text Options</label>
    <form-field model-key="top" field-id="chopTop"></form-field>
    <form-field model-key="top" field-id="chopBottom"></form-field>
    <form-field model-key="top" field-id="maxFontSize"></form-field>
    <form-field model-key="top" field-id="centerText"></form-field>
    <form-field model-key="top" field-id="citationStyle"></form-field>
</form-group>

<form-group class="with-border" group-id="bottom-text-options">
    <label>Bottom Text Options</label>
    <form-field model-key="bottom" field-id="chopTop"></form-field>
    <form-field model-key="bottom" field-id="chopBottom"></form-field>
    <form-field model-key="bottom" field-id="maxFontSize"></form-field>
    <form-field model-key="bottom" field-id="centerText"></form-field>
    <form-field model-key="top" field-id="citationStyle"></form-field>
</form-group>
