name: Desktop application

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master, feasibility/electron]

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run test:native
            - if: runner.os == 'Linux'
              run: xvfb-run -a npm test && xvfb-run -a npm run smoke
              env:
                  ELECTRON_NO_SANDBOX: '1'
            - if: runner.os != 'Linux'
              run: npm test && npm run smoke

    installers:
        needs: test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                    - os: windows-latest
                      platform: win
                      arch: x64
                    - os: macos-latest
                      platform: mac
                      arch: arm64
                    - os: macos-latest
                      platform: mac
                      arch: x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
            - if: runner.os == 'Linux'
              run: xvfb-run -a node tasks/electron/probe.js --output=.tmp/packaged-evidence
              env:
                  ELECTRON_NO_SANDBOX: '1'
                  ELECTRON_SMOKE_BINARY: ${{ github.workspace }}/dist/linux-unpacked/card-magician
            - uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ matrix.platform }}-${{ matrix.arch }}
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.exe
                      dist/*.dmg
                      dist/*.zip
                      dist/*.blockmap
            - if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: packaged-rendering-evidence
                  path: .tmp/packaged-evidence/
