name: Test

on:
    workflow_dispatch:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-24.04
        env:
            ELECTRON_NO_SANDBOX: '1'
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  path: card-magician
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  repository: matortheeternal/oracle-of-pie
                  ref: 947f2c4edc895c4912298c0e4b8f4d3818520de9
                  path: oracle-of-pie
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Install Electron system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1
            - run: npm ci --omit=dev
              working-directory: oracle-of-pie
            - run: npm ci
              working-directory: card-magician
              id: install
            - run: npm run test:native
              working-directory: card-magician
            - run: timeout 2m xvfb-run -a npm test
              working-directory: card-magician
            - run: timeout 5m xvfb-run -a npm run smoke
              working-directory: card-magician
            - name: Run template tests
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: xvfb-run -a npm run test:templates
              timeout-minutes: 35
              working-directory: card-magician
