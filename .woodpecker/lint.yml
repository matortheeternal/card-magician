when:
    - event: pull_request
      path:
          include:
              - 'src/**'
              - 'electron/**'
              - 'tasks/**'
              - 'games/**'
              - 'modules/**'
              - 'eslint.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.woodpecker/lint.yml'

steps:
    - name: eslint
      image: node:24-bookworm
      commands:
          - npm ci
          - npm run lint
