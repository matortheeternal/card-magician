when:
    - event: push
      branch: master
    - event: pull_request
      branch: master

steps:
    - name: test
      image: node:24-bookworm
      environment:
          ELECTRON_NO_SANDBOX: 1
      commands:
          - apt-get update
          - >
              apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0
              libnss3 libasound2 libgbm1
          - npm ci
          - npm run test:native
          - timeout 2m xvfb-run -a npm test
          - timeout 5m xvfb-run -a npm run smoke
          - timeout 2m xvfb-run -a npm run smoke:exit:mutations
