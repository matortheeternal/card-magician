extends: ./electron-builder.yml
productName: Card Magician
executableName: CardMagician
win:
    artifactName: 'Card-Magician-${version}-${os}-${arch}.${ext}'
    icon: build/icons/icon.ico
    target: nsis
nsis:
    perMachine: true
    oneClick: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: false
