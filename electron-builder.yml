appId: org.cardmagician.app
productName: Card Magician
executableName: card-magician
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
directories:
    app: .tmp/package
    output: dist
    buildResources: build
files:
    - '**/*'
    - '!**/node_modules/**/*'
asar: true
afterPack: tasks/electron/verifyPackage.cjs
npmRebuild: false
compression: maximum
electronLanguages:
    - en-US
electronFuses:
    runAsNode: false
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    onlyLoadAppFromAsar: true
linux:
    icon: build/icons/icon.png
    maintainer: Mator <mator@noreply.codeberg.org>
    syncDesktopName: true
    category: Graphics
    target:
        - tar.gz
        - deb
    extraFiles: &loosePlugins
        - from: .tmp/package-plugins/games
          to: games
        - from: .tmp/package-plugins/modules
          to: modules
        - from: .tmp/package-plugins/exporters
          to: exporters
        - from: .tmp/package-plugins/templates
          to: templates
win:
    extraFiles: *loosePlugins
    icon: build/icons/icon.ico
    target: nsis
nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: false
mac:
    icon: build/icons/icon.png
    category: public.app-category.graphics-design
    target:
        - dmg
        - zip
    extraFiles:
        - from: .tmp/package-plugins/games
          to: MacOS/games
        - from: .tmp/package-plugins/modules
          to: MacOS/modules
        - from: .tmp/package-plugins/exporters
          to: MacOS/exporters
        - from: .tmp/package-plugins/templates
          to: MacOS/templates
