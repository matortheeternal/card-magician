appId: org.cardmagician.app
productName: Card Magician
executableName: card-magician
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
directories:
    app: .tmp/package
    output: dist
    buildResources: build
files:
    - '**/*'
    - '!**/node_modules/**/*'
    - '!**/extensions/**/*'
asar: true
afterPack: tasks/electron/verifyPackage.cjs
npmRebuild: false
compression: normal
electronLanguages:
    - en-US
electronFuses:
    runAsNode: false
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    onlyLoadAppFromAsar: true
linux:
    icon: build/icons/icon.png
    maintainer: Mator <mator@noreply.codeberg.org>
    syncDesktopName: true
    category: Graphics
    desktop:
        entry:
            Name: Card Magician
            Comment: Custom card creation and editing
            Terminal: false
    target:
        - tar.gz
        - deb
win:
    icon: build/icons/icon.ico
    target: nsis
nsis:
    perMachine: true
    oneClick: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: false
mac:
    icon: build/icons/icon.png
    category: public.app-category.graphics-design
    target:
        - dmg
        - zip
fileAssociations:
    - ext: cmproj
      name: Card Magician Project
      rank: Owner
      role: Editor
      mimeType: application/x-card-magician-project
    - ext: cmpkg
      name: Card Magician Package
      rank: Owner
      role: Viewer
      mimeType: application/x-card-magician-package
