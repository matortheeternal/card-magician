<module-container module="SplitFrame"></module-container>
<div class="split-top">
    <div class="inner-card">
        <module-container module="SplitFrame" render="renderTop"></module-container>
        <div class="header">
            <module-container subcard="top" module="Name"></module-container>
            <module-container subcard="top" module="Cost"></module-container>
        </div>

        <module-container module="SplitArt" render="renderTop"></module-container>

        <div class="type-line">
            <module-container subcard="top" module="ColorIndicator"></module-container>
            <module-container subcard="top" module="Type"></module-container>
            <module-container module="Rarity"></module-container>
        </div>

        <module-container subcard="top" module="Text"></module-container>
        <module-container subcard="top" module="PT" render="renderPT"></module-container>
    </div>
</div>
<div class="split-bottom">
    <div class="inner-card">
        <module-container module="SplitFrame" render="renderBottom"></module-container>
        <div class="header">
            <module-container subcard="bottom" module="Name"></module-container>
            <module-container subcard="bottom" module="Cost"></module-container>
        </div>

        <module-container module="SplitArt" render="renderBottom"></module-container>

        <div class="type-line">
            <module-container subcard="bottom" module="ColorIndicator"></module-container>
            <module-container subcard="bottom" module="Type"></module-container>
            <module-container module="Rarity"></module-container>
        </div>

        <module-container subcard="bottom" module="Text"></module-container>
        <module-container subcard="bottom" module="PT" render="renderPT"></module-container>
    </div>
</div>
<div class="footer">
    <module-container module="Footer" render="renderInfo"></module-container>
    <module-container module="Footer" render="renderLegal"></module-container>
</div>
