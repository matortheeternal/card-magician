<form-field field-id="artImage"></form-field>
<form-group>
    <form-field field-id="rarity"></form-field>
    <form-field field-id="illustrator"></form-field>
</form-group>
<form-group group-id="footerOverrides" label="Footer Overrides"
            show="showFooterOverrides" optional>
    <form-field field-id="collectorNumber"></form-field>
    <form-field field-id="setCode"></form-field>
    <form-field field-id="language"></form-field>
    <form-field field-id="legalText"></form-field>
</form-group>

<h2>Bottom</h2>
<form-field model-key="bottom" field-id="name"></form-field>
<form-group model-key="bottom" group-id="color">
    <form-field model-key="bottom" field-id="manaCost"></form-field>
    <form-field model-key="bottom" field-id="colorOverride"></form-field>
</form-group>
<form-group model-key="bottom" group-id="type">
    <form-field model-key="bottom" field-id="superType"></form-field>
    <form-field model-key="bottom" field-id="subType"></form-field>
</form-group>
<form-field model-key="bottom" field-id="rulesText"></form-field>
<form-field model-key="bottom" field-id="flavorText" optional></form-field>
<form-group model-key="bottom" group-id="pt" label="PT" show="showPT" optional>
    <form-field model-key="bottom" field-id="power"></form-field>
    <form-field model-key="bottom" field-id="toughness"></form-field>
</form-group>

<h2>Top</h2>
<form-field model-key="top" field-id="name"></form-field>
<form-group model-key="top" group-id="color">
    <form-field model-key="top" field-id="manaCost"></form-field>
    <form-field model-key="top" field-id="colorOverride"></form-field>
</form-group>
<form-group model-key="top" group-id="type">
    <form-field model-key="top" field-id="superType"></form-field>
    <form-field model-key="top" field-id="subType"></form-field>
</form-group>
<form-field model-key="top" field-id="rulesText"></form-field>
<form-field model-key="top" field-id="flavorText" optional></form-field>
<form-group model-key="top" group-id="pt" label="PT" show="showPT" optional>
    <form-field model-key="top" field-id="power"></form-field>
    <form-field model-key="top" field-id="toughness"></form-field>
</form-group>
