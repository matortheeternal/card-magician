<module-container module="ClassicSplitFrame"></module-container>
<div class="split-top">
    <div class="inner-card">
        <module-container module="ClassicSplitFrame" render="renderTop"></module-container>
        <div class="header">
            <module-container subcard="top" module="Name"></module-container>
            <module-container subcard="top" module="Cost"></module-container>
        </div>

        <module-container module="Art" render="renderTop"></module-container>

        <div class="type-line">
            <module-container subcard="top" module="Type"></module-container>
            <module-container module="Rarity"></module-container>
        </div>

        <module-container subcard="top" module="Text"></module-container>
        <module-container subcard="top" module="PT" render="renderPT"></module-container>
        <footer>
            <module-container module="ClassicFooter" render="renderInfo"></module-container>
            <module-container module="ClassicFooter" render="renderLegal"></module-container>
        </footer>
    </div>
</div>
<div class="split-bottom">
    <div class="inner-card">
        <module-container module="ClassicSplitFrame" render="renderBottom"></module-container>
        <div class="header">
            <module-container subcard="bottom" module="Name"></module-container>
            <module-container subcard="bottom" module="Cost"></module-container>
        </div>

        <module-container module="Art" render="renderBottom"></module-container>

        <div class="type-line">
            <module-container subcard="bottom" module="Type"></module-container>
            <module-container module="Rarity"></module-container>
        </div>

        <module-container subcard="bottom" module="Text"></module-container>
        <module-container subcard="bottom" module="PT" render="renderPT"></module-container>
        <footer>
            <module-container module="ClassicFooter" render="renderInfo"></module-container>
            <module-container module="ClassicFooter" render="renderLegal"></module-container>
        </footer>
    </div>
</div>
